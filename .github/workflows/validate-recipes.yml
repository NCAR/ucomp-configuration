name: Run Validator and Commit Changes

on:
  push:
    branches:
      - main

permissions:
  contents: write   # required for the push

jobs:
  run-validator:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy matplotlib

      - name: Run validator.py
        run: python validation_scripts/validator.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changes-detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes-detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes-detected == 'true'
        run: |
          git commit -m "Apply changes from validator.py"
          git push origin main
